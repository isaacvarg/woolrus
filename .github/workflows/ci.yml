name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: woolrus
          POSTGRES_PASSWORD: woolrus
          POSTGRES_DB: woolrus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U woolrus" --health-interval 2s --health-retries 30
      # Object storage for attachments; health checks it. Web creates the bucket on first use.
      storage:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: woolrus
          RUSTFS_SECRET_KEY: woolrus-secret
        ports: ["9000:9000"]
    env:
      DATABASE_URL: postgresql://woolrus:woolrus@localhost:5432/woolrus
      TEST_DATABASE_URL: postgresql://woolrus:woolrus@localhost:5432/woolrus_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      # Throwaway key for CI's ephemeral database only; it never protects a real secret.
      SETTINGS_ENCRYPTION_KEY: Y2ktb25seS1rZXktY2ktb25seS1rZXktY2ktb25seSE=
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: woolrus
      S3_SECRET_KEY: woolrus-secret
      S3_BUCKET: woolrus-attachments
      # RustFS runs here, so the shared storage suite also runs against the real S3 adapter.
      STORAGE_LIVE: "1"
      # In-memory shipping providers for tests and Playwright: honoured in development, test, or an
      # e2e run (WOOLRUS_E2E=1 on the Playwright step below), never in a deploy.
      SHIPPING_PROVIDERS: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE woolrus_test"
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations apply cleanly and match the schema
        run: pnpm db:deploy && pnpm --filter @woolrus/db migrate:check
      # Web enqueues jobs (Sync now, webhooks); without a worker, nothing else creates pg-boss's tables.
      - name: Job queue tables
        run: pnpm jobs:install
      - run: pnpm test
      - run: pnpm build
      - name: End-to-end smoke tests
        run: |
          pnpm --filter @woolrus/web exec playwright install --with-deps chromium
          (cd apps/web && pnpm start &) 
          npx --yes wait-on@8 http://localhost:3000/api/health
          pnpm --filter @woolrus/web test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          # The production build Playwright runs honours SHIPPING_PROVIDERS=fake only with this.
          WOOLRUS_E2E: "1"
